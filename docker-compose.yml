services:
  postgres:
    # Pin to PostgreSQL 16: it initializes POSTGRES_USER correctly on the
    # current Apple Silicon Docker runtime used for local development.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oa
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa_dev_password
    ports:
      # Avoid the common local PostgreSQL service already using 5432.
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oa -d oa"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oa_minio
      MINIO_ROOT_PASSWORD: oa_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
